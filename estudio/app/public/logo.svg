<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2a0716"/>
      <stop offset="55%" stop-color="#150409"/>
      <stop offset="100%" stop-color="#050103"/>
    </radialGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3aa0"/>
      <stop offset="100%" stop-color="#ec1e86"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9f4"/>
      <stop offset="100%" stop-color="#ffcfe6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="504" height="504" rx="120" fill="url(#bg)"/>

  <g filter="url(#glow)">
    <!-- janela do navegador -->
    <rect x="150" y="150" width="212" height="212" rx="20" stroke="url(#pink)" stroke-width="15"/>
    <line x1="150" y1="205" x2="362" y2="205" stroke="url(#pink)" stroke-width="13"/>
    <circle cx="180" cy="178" r="6.5" fill="#ff3aa0"/>
    <circle cx="205" cy="178" r="6.5" fill="#ff3aa0"/>
    <rect x="300" y="172" width="52" height="11" rx="5.5" fill="#ff3aa0"/>

    <!-- fábrica -->
    <g transform="translate(201,228) scale(5.4)">
      <path d="M2 22V10l7-5v5l7-5v17a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1Z" fill="url(#soft)"/>
      <rect x="4.5" y="2.8" width="2.7" height="4.2" rx="0.5" fill="url(#soft)"/>
      <rect x="11.5" y="2.8" width="2.7" height="4.2" rx="0.5" fill="url(#soft)"/>
      <rect x="5.3" y="13.4" width="3.3" height="8.2" rx="0.6" fill="#c9187a"/>
      <rect x="10.4" y="13.4" width="3.3" height="8.2" rx="0.6" fill="#c9187a"/>
    </g>

    <!-- cursor -->
    <path d="M355 300 L355 372 L373 356 L385 380 L397 375 L385 352 L408 352 Z"
      fill="url(#bg)" stroke="url(#pink)" stroke-width="11" stroke-linejoin="round"/>
  </g>
</svg>
